spring:
  application:
    name: TaskRacer
  datasource:
    url: ${JDBC_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}

logging:
  logstash:
    enabled: true
    host: ${LOGGING_HOST:}
    port: ${LOGGING_PORT:}